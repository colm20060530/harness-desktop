<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
  <title>Harness Desktop</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      color: #dce9f7;
      background:
        radial-gradient(1100px 620px at 50% -12%, rgba(58, 128, 190, 0.34), transparent 62%),
        radial-gradient(900px 520px at 12% 108%, rgba(38, 102, 168, 0.28), transparent 60%),
        radial-gradient(900px 520px at 90% 110%, rgba(24, 76, 132, 0.30), transparent 60%),
        linear-gradient(180deg, #0a1420 0%, #0c1a2b 52%, #0a1626 100%);
      user-select: none;
    }

    /* ---- ambient aurora blobs ---- */
    .aurora {
      position: fixed;
      inset: -30%;
      pointer-events: none;
      filter: blur(70px);
      opacity: 0.5;
      animation: aurora-drift 16s ease-in-out infinite alternate;
      background:
        radial-gradient(38% 34% at 28% 30%, rgba(64, 156, 235, 0.22), transparent 70%),
        radial-gradient(32% 30% at 74% 22%, rgba(44, 110, 190, 0.18), transparent 70%),
        radial-gradient(36% 40% at 60% 78%, rgba(26, 86, 150, 0.24), transparent 72%);
    }
    @keyframes aurora-drift {
      from { transform: translate3d(-3%, -2%, 0) rotate(-2deg) scale(1); }
      to { transform: translate3d(4%, 3%, 0) rotate(3deg) scale(1.08); }
    }

    /* ---- rising bubbles ---- */
    .bubble {
      position: fixed;
      bottom: -24px;
      border-radius: 50%;
      border: 1px solid rgba(127, 216, 245, 0.22);
      background: radial-gradient(circle at 32% 30%, rgba(180, 232, 255, 0.32), rgba(127, 216, 245, 0.06) 55%, transparent 70%);
      pointer-events: none;
      animation: bubble-rise linear infinite;
    }
    @keyframes bubble-rise {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      8% { opacity: 0.7; }
      92% { opacity: 0.5; }
      100% { transform: translateY(-112vh) translateX(24px); opacity: 0; }
    }

    /* ---- scene card ---- */
    .stage {
      position: relative;
      text-align: center;
      animation: stage-in 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    }
    @keyframes stage-in {
      from { opacity: 0; transform: translateY(22px) scale(0.96); filter: blur(6px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    /* ---- logo tile with ring + shine ---- */
    .logo-wrap {
      position: relative;
      width: 128px;
      height: 128px;
      margin: 0 auto 26px;
    }
    .ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0 16%, rgba(127, 216, 245, 0.9) 22%, transparent 34% 52%, rgba(82, 154, 226, 0.75) 60%, transparent 72% 88%, rgba(127, 216, 245, 0.5) 94%, transparent 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
      animation: ring-spin 3.2s linear infinite;
      filter: drop-shadow(0 0 10px rgba(110, 200, 250, 0.55));
    }
    @keyframes ring-spin {
      to { transform: rotate(360deg); }
    }
    .orbit {
      position: absolute;
      inset: -26px;
      border: 1px dashed rgba(127, 216, 245, 0.20);
      border-radius: 50%;
      animation: ring-spin 14s linear infinite;
    }
    .orbit::before,
    .orbit::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8fe0ff;
      box-shadow: 0 0 12px rgba(143, 224, 255, 0.9);
      top: 50%;
      left: -3px;
      animation: orbit-pulse 2.4s ease-in-out infinite;
    }
    .orbit::after {
      background: #5ba6e8;
      box-shadow: 0 0 12px rgba(91, 166, 232, 0.9);
      left: auto;
      right: -3px;
      animation-delay: 1.2s;
    }
    @keyframes orbit-pulse {
      0%, 100% { opacity: 0.45; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .tile {
      position: absolute;
      inset: 0;
      border-radius: 30px;
      background: linear-gradient(145deg, #143150, #0b1a2a);
      border: 1px solid rgba(127, 216, 245, 0.38);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35),
        0 24px 70px rgba(0, 8, 18, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -12px 34px rgba(0, 0, 0, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .tile img {
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.45));
      animation: logo-float 3.4s ease-in-out infinite;
    }
    @keyframes logo-float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.025); }
    }
    .shine {
      position: absolute;
      inset: 0;
      border-radius: 30px;
      background: linear-gradient(115deg, transparent 28%, rgba(255, 255, 255, 0.16) 42%, rgba(255, 255, 255, 0.02) 55%, transparent 68%);
      background-size: 260% 100%;
      animation: shine-sweep 2.8s ease-in-out infinite;
    }
    @keyframes shine-sweep {
      0% { background-position: 120% 0; }
      55%, 100% { background-position: -120% 0; }
    }
    .breath {
      position: absolute;
      inset: -34px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(78, 156, 226, 0.22), transparent 68%);
      animation: breath 3.4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes breath {
      0%, 100% { opacity: 0.55; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    /* ---- copy ---- */
    h1 {
      font-size: 23px;
      font-weight: 650;
      letter-spacing: 0.4px;
      margin-bottom: 10px;
      background: linear-gradient(92deg, #dff3ff 8%, #7fd8f5 46%, #a5d9ff 78%, #dff3ff 96%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: title-shimmer 3.2s linear infinite;
    }
    @keyframes title-shimmer {
      to { background-position: -200% center; }
    }
    .sub {
      font-size: 13px;
      color: #7d94ab;
      margin-bottom: 30px;
      letter-spacing: 0.3px;
    }
    .sub .dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #7fd8f5;
      margin: 0 6px 2px;
      opacity: 0.8;
      animation: dot-blink 1.4s ease-in-out infinite;
    }
    @keyframes dot-blink {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }

    /* ---- progress ---- */
    .track {
      width: 240px;
      height: 5px;
      margin: 0 auto;
      border-radius: 999px;
      background: rgba(127, 216, 245, 0.12);
      overflow: hidden;
      position: relative;
    }
    .fill {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #5db8f2 30%, #9be4ff 50%, #5db8f2 70%, transparent);
      background-size: 220px 100%;
      animation: fill-flow 1.5s ease-in-out infinite;
      width: 40%;
    }
    @keyframes fill-flow {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(360%); }
    }
    .status {
      margin-top: 14px;
      font-size: 11.5px;
      color: #5f7893;
      letter-spacing: 0.3px;
      transition: opacity 0.35s ease;
    }
  </style>
