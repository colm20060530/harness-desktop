# Harness Desktop built-in plugin overlay.
#
# This file is applied on every launch via `dsh web --patch <this file>`, so
# the plugin is always present in the desktop app's composition. It is never
# written into the user's own cordis.patch.yml, which means official
# `dsh web` (run outside this app) stays completely stock.
#
# The module `@deepseek-ai/dsh-client-ui-aqua` is made resolvable by the
# desktop launcher, which keeps a self-healing link at
#   $DSH_HOME/profiles/node_modules/@deepseek-ai/dsh-client-ui-aqua
#
- insert:
    - id: ui-aqua
      name: '@deepseek-ai/dsh-client-ui-aqua'
